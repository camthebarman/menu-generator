name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      POSTGREST_VERSION: v12.2.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Install PostgreSQL 16 server and PostgREST
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 postgresql-client-16
          curl -sSfL -o /tmp/pgrst.tar.xz "https://github.com/PostgREST/postgrest/releases/download/${POSTGREST_VERSION}/postgrest-${POSTGREST_VERSION}-linux-static-x64.tar.xz"
          tar -xf /tmp/pgrst.tar.xz -C /tmp
          echo "POSTGREST_BIN=/tmp/postgrest" >> "$GITHUB_ENV"
          echo "PGBIN=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"
      - name: Database, RLS, concurrency, and live data-layer tests
        run: npm run test:db
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests (demo mode)
        run: npm run test:e2e
      - name: Browser tests (live mode against PostgREST)
        run: npm run test:e2e:live
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
